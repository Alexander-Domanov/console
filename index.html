<style>

  #bar .t{margin-left:8px}
  #bar .right{margin-left:auto;color:var(--magenta);letter-spacing:1.4px;font-size:11px;
       display:flex;align-items:center;gap:6px}
  .live{width:7px;height:7px;background:var(--magenta);animation:pulse 1.6s infinite}

  #body{display:grid;grid-template-columns:1fr 250px;gap:0}

  .c-echo{color:#7fb0c8}
  .c-ok{color:var(--lime)} .c-err{color:var(--magenta)} .c-dim{color:var(--dim)}
  .c-dimmer{color:var(--dimmer)} .c-key{color:var(--cyan)} .c-warn{color:var(--amber)}
  .c-big{font-size:30px;letter-spacing:1px;color:#eaf7ff;font-weight:700;line-height:1.2}
  .c-sub{color:var(--lime);letter-spacing:1px}
  .row{cursor:pointer}
  .row:hover{background:rgba(46,230,255,.07)}
  .row b{color:var(--cyan);font-weight:400}
  .chip{display:inline-block;border:1px solid var(--rail);color:var(--dim);padding:2px 9px;
        margin:6px 6px 0 0;cursor:pointer;font-size:12px}
  .chip:hover{border-color:var(--cyan);color:var(--cyan)}

  #prompt{display:flex;align-items:center;gap:8px;border-top:1px solid var(--rail);

  #user{color:var(--lime)} #sig{color:var(--dim)}

  #hud{border-left:1px solid var(--rail);padding:16px 16px;display:flex;flex-direction:column;gap:14px}
  .h{font-size:10.5px;letter-spacing:1.8px;color:var(--dimmer)}
  #radar{width:100%;height:150px}
  .meter{font-size:12px;color:var(--text);white-space:pre}
  #hud .val{color:var(--dimmer)}
  #scan{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
        background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,transparent 1px 4px)}
  body.scan #scan{opacity:1}
  #glow{position:fixed;width:340px;height:340px;left:0;top:0;pointer-events:none;
        transform:translate(-50%,-50%);border-radius:50%;
        background:radial-gradient(circle,rgba(46,230,255,.10) 0%,rgba(46,230,255,.04) 40%,transparent 70%);
        transition:opacity .3s}
  .ripple{position:fixed;width:16px;height:16px;border:1px solid var(--cyan);border-radius:50%;
        transform:translate(-50%,-50%);pointer-events:none;animation:rip .5s ease-out forwards}
  @keyframes rip{to{width:120px;height:120px;opacity:0}}
  #cv{display:none;background:#05080f;border:1px solid var(--rail);margin-top:6px}
  #hint{font-size:11.5px;color:var(--dimmer);padding:6px 0 2px}
  #sakura{position:fixed;inset:0;pointer-events:none;z-index:1}
  #win{position:relative;z-index:2}
  body.sakura #win{border-color:rgba(255,141,199,.38);box-shadow:0 0 60px rgba(255,61,154,.10)}
  .strip{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin-top:7px}
  .strip i{height:11px;background:#171a24;border-radius:2px;display:block}
  .strip i.hit{background:rgba(154,240,63,.55)}
  .strip i.on{background:#2ee6ff;box-shadow:0 0 9px #2ee6ff}
  @media (max-width:820px){

    #bar,#bar .right,.chip,.h,.meter,#hint,#radar text{font-size:13px}
    #inp{border:1px solid var(--rail);background:rgba(46,230,255,.06);padding:5px 7px;border-radius:4px}
  }
</style>

const $=s=>document.querySelector(s);
const out=$("#out"), inp=$("#inp"), cv=$("#cv"), ctx=cv.getContext("2d");

/* ---------- sound: generated, no files ---------- */
let ac=null;
function beep(f=520,d=.05,type="square",vol=.025){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(vol,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}

/* ---------- tiny output helpers ---------- */
function ln(text,cls,opts){
  const d=document.createElement("div");
  d.className="ln "+(cls||"c-dim");
  if(opts&&opts.html){d.innerHTML=text}else{d.textContent=text}
  if(opts&&opts.click){d.classList.add("row");d.addEventListener("click",()=>{beep(700,.04);opts.click()})}
  out.appendChild(d); out.scrollTop=out.scrollHeight;
  return d;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function type(text,cls,delay=16){
  const d=ln("",cls||"c-dim"); let s="";
  for(const ch of text){s+=ch; d.textContent=s; if(!(delay===0))await sleep(delay)}
  return d;
}
function chips(items){
  const w=document.createElement("div"); w.className="ln";
  items.forEach(t=>{
    const c=document.createElement("span"); c.className="chip"; c.textContent=t;
    c.addEventListener("click",()=>{beep(880,.04);run(t)});
    w.appendChild(c);
  });
  out.appendChild(w); out.scrollTop=out.scrollHeight;
}

/* ---------- data ---------- */
// no names: the work is public, the project names are not
const RECORDS=[
  {id:"record-01",kind:"public",stack:"typescript",when:"2026-09",what:"module config sync, ci"},
  {id:"record-02",kind:"public",stack:"typescript",when:"2026-08",what:"ci workflow, license, readme"},
  {id:"record-03",kind:"public",stack:"typescript",when:"2026-08",what:"routing and deploy to pages"},
  {id:"record-04",kind:"private",stack:"mixed",when:"2026-08",what:"internal tooling"},
  {id:"record-05",kind:"private",stack:"mixed",when:"2026-08",what:"client work"},
  {id:"record-06",kind:"private",stack:"python",when:"2026-07",what:"api service"}
];
// every figure on this page is fetched live at load; none of it is typed in by hand
const LIVE={ready:false,failed:false,stats:null,shipped:[],langs:{},repos:null};
const FIGURES=["./figures.json",
  "https://raw.githubusercontent.com/Alexander-Domanov/Alexander-Domanov/main/assets/out/manifest.json"];
const DOOM_TONE=290;           // Hz \u2014 the boot sound, not a figure
async function loadFigures(){
  for(const url of FIGURES){
    try{
      const res=await fetch(url,{cache:"no-store"});
      if(!res.ok) continue;
      const m=await res.json();
      if(m&&m.stats){LIVE.stats=m.stats;LIVE.shipped=m.shipped||[];LIVE.langs=m.languages||{};LIVE.ready=true;break}
    }catch(err){/* try the next source */}
  }
  if(!LIVE.ready)LIVE.failed=true;
  try{
    const res=await fetch("https://api.github.com/users/Alexander-Domanov",{cache:"no-store"});
    const u=await res.json(); LIVE.repos=u.public_repos;
  }catch(err){/* the repo count stays blank, the rest of the page is fine */}
}
function pct(part,whole){return Math.round(part/whole*100)+"%"}
function topLangs(){
  const rows=Object.entries(LIVE.langs).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const total=Object.values(LIVE.langs).reduce((a,b)=>a+b,0)||1;
  return rows.map(([n,v])=>n.toLowerCase()+" "+pct(v,total)).join(" \u00b7 ");
}
function figureRows(){
  const s=LIVE.stats||{};
  const shipped=LIVE.shipped.filter(x=>String(x.date||"").startsWith(String(new Date().getFullYear()))).length;
  return [["public repos", LIVE.repos!=null?String(LIVE.repos):"n/a"],
    ["shipped this year", LIVE.ready?String(shipped):"n/a"],
    ["private work","names withheld"],
    ["last ship", s.last_active||"n/a"],
    ["top languages", LIVE.ready?topLangs():"n/a"],
    ["contributions", LIVE.ready?(s.contributions+" contributions on "+s.active_days+" active days"):"figures offline"]];
}
function monthRows(){
  if(!LIVE.ready) return [];
  return LIVE.stats.months.slice(-12).map(([k,v])=>[k,v]);
}
function figureLine(){
  const s=LIVE.stats;
  if(!s) return "the daily figures are still loading \u00b7 run `year` in a moment";
  const repos=LIVE.repos!=null?LIVE.repos+" public repos":"";
  return [s.contributions+" contributions on "+s.active_days+" active days this year",
          s.longest_run+" day run",repos].filter(Boolean).join(" \u00b7 ");
}
const DEAD=[["snake.service","inactive (dead)","removed upstream","2026-08"],
            ["spotify.service","inactive (dead)","token expired","2026-07"],
            ["trophy.service","failed","402 deployment disabled","2026-09"],
            ["metrics.service","failed","gateway timeout","2026-09"]];
const SENSORS=[["SHIPPING",86,"#9af03f"],["FRONTEND",92,"#2ee6ff"],["BACKEND",64,"#2ee6ff"],
               ["COFFEE",99,"#ffb020"],["SLEEP",31,"#ff3d9a"]];
function drawMeters(){
  $("#meters").innerHTML = SENSORS.map(([n,v,c])=>
    n.padEnd(9,"\u00a0")+"<span style='color:"+c+"'>"+"\u2588".repeat(Math.round(v/100*12))
    +"</span><span class='val'>"+"\u2591".repeat(12-Math.round(v/100*12))+"</span>").join("<br>");
}

async function cmdLs(){

async function cmdOpen(id){

  ln("  want the name? ask in a dm.","c-ok");
  beep(660,.06);
}
async function cmdYear(){
  const rows=monthRows();
  if(!rows.length){ln("the figures are still loading \u00b7 try `year` again in a moment","c-warn");return}
  const peak=Math.max(...rows.map(m=>m[1]))||1;
  rows.forEach(([m,v])=>{
    const n=Math.round(v/peak*28);
    ln(m.padEnd(8," ")+"#".repeat(n)+" "+v, v?"c-ok":"c-dimmer");
  });
  ln(rows.filter(m=>!m[1]).length+" months are genuinely empty. that is the honest chart.","c-dim");
}

/* ---------- snake: the old thing, still alive ---------- */
const G={on:false,cx:0,cy:0,dx:1,dy:0,body:[],food:[0,0],score:0,t:null,dead:false,paused:false};
const CELL=20, COLS=30, ROWS=15;
function resetG(){
  G.cx=8;G.cy=7;G.dx=1;G.dy=0;G.body=[[8,7],[7,7],[6,7]];G.score=0;G.dead=false;G.paused=false;
  placeFood();
}
function placeFood(){
  do{G.food=[Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS)]}
  while(G.body.some(([x,y])=>x===G.food[0]&&y===G.food[1]));
}
function drawG(){
  ctx.fillStyle="#05080f"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle="rgba(19,43,68,.8)"; ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,ROWS*CELL);ctx.stroke()}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL+.5);ctx.lineTo(COLS*CELL,y*CELL+.5);ctx.stroke()}
  ctx.fillStyle="#ff3d9a";
  ctx.shadowBlur=10;ctx.shadowColor="rgba(255,61,154,.8)";
  ctx.beginPath();ctx.arc(G.food[0]*CELL+CELL/2,G.food[1]*CELL+CELL/2,7,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.shadowBlur=8; ctx.shadowColor="rgba(154,240,63,.55)";
  G.body.forEach(([x,y],i)=>{
    ctx.fillStyle = i===0 ? "#eaf7ff" : (i%2 ? "#9af03f" : "#b6ff62");
    ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);
  });
  ctx.shadowBlur=0;
  ctx.fillStyle="#5f849f"; ctx.font="13px ui-monospace,monospace";
  ctx.fillText("score "+G.score,8,ROWS*CELL-6);
  if(G.dead){
    ctx.fillStyle="rgba(5,8,15,.82)"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#ff3d9a"; ctx.font="20px ui-monospace,monospace";
    ctx.fillText("game over \u00b7 score "+G.score,150,150);
    ctx.fillStyle="#cfe9f5"; ctx.font="13px ui-monospace,monospace";
    ctx.fillText("r restart \u00b7 q quit",240,180);
  }else if(G.paused){
    ctx.fillStyle="rgba(5,8,15,.72)"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#2ee6ff"; ctx.font="16px ui-monospace,monospace";
    ctx.fillText("paused \u00b7 click to resume",180,160);
  }
}
function tick(){
  if(G.dead||G.paused)return;
  G.cx+=G.dx; G.cy+=G.dy;
  if(G.cx<0||G.cy<0||G.cx>=COLS||G.cy>=ROWS||G.body.some(([x,y])=>x===G.cx&&y===G.cy)){
    G.dead=true; beep(160,.25,"sawtooth",.04); drawG(); return;
  }
  G.body.unshift([G.cx,G.cy]);
  if(G.cx===G.food[0]&&G.cy===G.food[1]){G.score++;placeFood();beep(920,.05)}
  else{G.body.pop()}
  drawG();
}
function startSnake(){
  G.on=true; cv.style.display="block"; resetG(); drawG();
  clearInterval(G.t); G.t=setInterval(tick,110);
  state.cmd="snake";
  ln("snake \u00b7 arrows or wasd \u00b7 p pause \u00b7 q quit","c-ok");
  ln("this is the widget that used to sit on my profile, except this one runs.","c-dim");
}
function stopSnake(){
  G.on=false; clearInterval(G.t); cv.style.display="none"; state.cmd="idle";
  ln("session closed \u00b7 the old thing still works, it just is not a badge anymore.","c-dim");
}
addEventListener("keydown",e=>{
  if(!G.on)return;
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  if(k==="q"||k==="escape"){stopSnake();return}
  if(k==="r"){resetG();drawG();return}
  if(k==="p"){G.paused=!G.paused;drawG();return}
  if(G.dead)return;
  const up=(k==="arrowup"||k==="w"), dn=(k==="arrowdown"||k==="s"),
        lf=(k==="arrowleft"||k==="a"), rt=(k==="arrowright"||k==="d");
  if(up&&G.dy===0){G.dy=-1;G.dx=0} else if(dn&&G.dy===0){G.dy=1;G.dx=0}
  else if(lf&&G.dx===0){G.dx=-1;G.dy=0} else if(rt&&G.dx===0){G.dx=1;G.dy=0}
  if(up||dn||lf||rt)beep(1100,.02,"square",.012);
});
cv.addEventListener("click",()=>{if(G.on&&!G.dead){G.paused=!G.paused;drawG()}});

/* ---------- the dispatcher ---------- */
async function run(text){
  const raw=(text||inp.value).trim(); inp.value="";
  if(!raw)return;
  if(G.on){ if(["stop","q","quit","exit"].includes(raw.toLowerCase()))stopSnake(); return }
  ln("domanov@vps$ "+raw,"c-echo");
  const [c,arg]=raw.split(/\s+/);
  state.cmd=c; beep(620,.03,"square",.015);
  const table={help:cmdHelp,whoami:cmdWhoami,ls:cmdLs,year:cmdYear,legacy:cmdLegacy,
    studio:cmdStudio,doom:cmdDoom,music:cmdMusic,sakura:cmdSakura,contact:cmdContact,hire:cmdHire,theme:cmdTheme,
    open:()=>cmdOpen(arg||""),snake:startSnake,clear:async()=>{out.innerHTML=""},
    sudo:async()=>cmdSudo()};
  const fn=table[c];
  if(!fn){ln("command not found: "+c+" \u00b7 try help","c-err");beep(180,.12,"sawtooth",.03);return}
  await fn();
  while(out.childElementCount>200)out.removeChild(out.firstChild);
  out.scrollTop=out.scrollHeight;
}

/* ---------- pointer tracking: the page follows the cursor ---------- */
const glow=$("#glow"), wedge=$("#wedge"), cur=$("#cur");
let raf=null, mx=0, my=0;
addEventListener("mousemove",e=>{
  mx=e.clientX; my=e.clientY;
  if(raf)return;
  raf=requestAnimationFrame(()=>{
    raf=null;
    glow.style.left=mx+"px"; glow.style.top=my+"px";
    const r=$("#radar").getBoundingClientRect();
    const a=Math.atan2(my-(r.top+r.height/2),mx-(r.left+r.width/2))*180/Math.PI;
    wedge.setAttribute("transform","rotate("+a+" 100 75)");
    cur.innerHTML="x "+Math.round(mx)+" y "+Math.round(my)+
      "<span class='val'> \u00b7 bearing "+(((a+450)%360)).toFixed(0)+"\u00b0</span>";
  });
});
addEventListener("mousedown",e=>{
  const d=document.createElement("div"); d.className="ripple";
  d.style.left=e.clientX+"px"; d.style.top=e.clientY+"px";
  document.body.appendChild(d); setTimeout(()=>d.remove(),500);
  beep(760,.03,"square",.012);
});
addEventListener("mouseleave",()=>{cur.innerHTML="pointer left the screen<span class='val'> \u00b7 radar idle</span>"});

/* ---------- tape 01: what you recorded in the studio, playing here ---------- */
const tape = (window.BAND ? BAND.load() : null);
let tac=null, tmaster=null, tplaying=false, tstep=0, tnext=0, tapeMuted=false;
function tapeHits(){ return tape ? BAND.hitsOf(tape) : 0 }
function tapeCtx(){
  if(!tac){ tac=new (window.AudioContext||window.webkitAudioContext)();
    tmaster=tac.createGain(); tmaster.gain.value=0.30; tmaster.connect(tac.destination); }
  if(tac.state==="suspended") tac.resume();
  return tac;
}
function tapePlay(on){
  if(!tape) return false;
  tapeCtx(); tplaying=on;
  if(on){ tstep=0; tnext=tac.currentTime+0.06 } else tapeMuted=true;
  $("#state").dataset.tape = on ? "on" : "off";
  tapeRow();
  return true;
}
function tapeStep(i){
  const el=$("#tapeBars"); if(!el) return;
  [...el.children].forEach((b,k)=>b.classList.toggle("on", k===i));
}
function tapeSchedule(){
  if(!tplaying||!tac||!tape) return;
  const spb=60/tape.bpm/4;
  while(tnext<tac.currentTime+0.12){
    BAND.step(tac,tmaster,tape,tstep,tnext,1);
    const i=tstep, at=Math.max(0,(tnext-tac.currentTime)*1000);
    setTimeout(()=>tapeStep(i), at);
    tnext+=spb; tstep=(tstep+1)%16;
  }
}
setInterval(tapeSchedule,25);
function tapeRow(){
  const el=$("#tapeRow"), bars=$("#tapeBars");
  if(!tape){ el.innerHTML="empty <span class='val'>\u00b7 record one in the studio</span>"; bars.innerHTML=""; return }
  el.innerHTML="tape 01 \u00b7 "+tapeHits()+" hits<span class='val'> \u00b7 "+tape.bpm+" bpm \u00b7 "
    +(BAND.riffName(tape)?"riff "+BAND.riffName(tape)+" \u00b7 ":"")
    +(tplaying?"playing":"stopped")+"</span>";
  bars.innerHTML=[...Array(16)].map((_,i)=>{
    const hit = Object.values(tape.drums).some(a=>a[i]) || tape.chords[i];
    return "<i class='"+(hit?"hit":"")+"'></i>";
  }).join("");
}
window.__tapeState=()=>({playing:tplaying,hits:tapeHits(),bpm:tape?tape.bpm:0,saved:tape?tape.saved:null});

/* ---------- sakura: a branch in the corner, petals in the air, wind from your cursor ---------- */
(function(){
  const cv=document.getElementById("sakura"), g=cv.getContext("2d");
  let W=0,H=0,DPR=1, branch=null, petals=[], px=-999, py=-999, pvx=0, pvy=0, storm=0, t=0, pushes=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);

  function blossom(c,x,y,r){
    c.fillStyle="rgba(255,140,196,"+rnd(0.5,0.9).toFixed(2)+")";
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2+Math.random()*0.1;
      c.beginPath(); c.ellipse(x+Math.cos(a)*r*0.5,y+Math.sin(a)*r*0.5,r*0.55,r*0.4,a,0,Math.PI*2); c.fill(); }
    c.fillStyle="rgba(255,238,247,.8)"; c.beginPath(); c.arc(x,y,r*0.2,0,Math.PI*2); c.fill();
  }
  function limb(c,x,y,ang,len,wd,depth){
    const cx=x+Math.cos(ang+0.45)*len*0.5, cy=y+Math.sin(ang+0.45)*len*0.5;
    const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
    c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(cx,cy,x2,y2);
    c.lineWidth=wd; c.lineCap="round"; c.strokeStyle="rgba(176,138,146,.95)"; c.stroke();
    c.lineWidth=Math.max(0.7,wd*0.3); c.strokeStyle="rgba(255,160,205,.5)"; c.stroke();
    if(depth<=0){ blossom(c,x2,y2,rnd(4,7)); return }
    const n=Math.random()<0.4?3:2;
    for(let i=0;i<n;i++)
      limb(c,x2,y2,ang+(i-(n-1)/2)*0.52+rnd(-0.2,0.2),len*rnd(0.6,0.8),Math.max(1,wd*0.64),depth-1);
    if(Math.random()<0.5) blossom(c,x2,y2,rnd(3.5,6));
  }
  function grow(){
    const o=document.createElement("canvas"); o.width=cv.width; o.height=cv.height;
    const c=o.getContext("2d");
    c.setTransform(DPR,0,0,DPR,0,0);
    limb(c,W+14,-18,Math.PI*0.66,W*0.11,9,5);            // main branch, top right
    limb(c,W+14,-18,Math.PI*0.86,W*0.06,6,4);
    limb(c,-18,W*0.14,Math.PI*0.22,W*0.085,6,5);         // second branch, top left
    limb(c,W*0.2,W*0.30,-Math.PI*0.5,W*0.03,4,3);        // blossom spray below the main branch
    branch=o;
  }
  const sprite=(()=>{ const c=document.createElement("canvas"); c.width=c.height=20;
    const x=c.getContext("2d"); x.translate(10,10);
    x.fillStyle="#ff8ec4"; x.beginPath(); x.moveTo(0,8);
    x.bezierCurveTo(7.5,5,8,-3.5,0,-8); x.bezierCurveTo(-8,-3.5,-7.5,5,0,8); x.fill();
    x.fillStyle="rgba(255,226,242,.9)"; x.beginPath(); x.ellipse(0,0,1.7,4.8,0,0,Math.PI*2); x.fill();
    return c; })();
  function petal(top){ return { x:rnd(0,W), y: top?rnd(-H*0.4,0):rnd(0,H), vx:rnd(-0.25,0.35), vy:rnd(0.35,1.15),
    r:rnd(0.6,1.15), rot:rnd(0,Math.PI*2), vr:rnd(-0.03,0.03), sw:rnd(0.4,1.3), ph:rnd(0,Math.PI*2), a:rnd(0.62,1) }; }
  function size(){
    DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px";
    grow();
    petals=[]; for(let i=0;i<80;i++) petals.push(petal(false));
  }
  addEventListener("resize",size); size();
  addEventListener("mousemove",e=>{ const dx=e.clientX-px, dy=e.clientY-py;
    if(Math.abs(dx)<160&&Math.abs(dy)<160){ pvx=dx; pvy=dy; }  /* скачок = не ветер, а телепорт курсора */
    px=e.clientX; py=e.clientY; },{passive:true});
  addEventListener("mouseleave",()=>{ px=-999; py=-999; });

  function frame(){
    t+=1/60; g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
    if(branch){ g.save(); g.translate(W*0.5,H*0.06);
      g.rotate(Math.sin(t*0.5)*0.012); g.translate(-W*0.5,-H*0.06);
      g.drawImage(branch,0,0,W,H); g.restore(); }
    const want=storm>0?190:80;
    while(petals.length<want) petals.push(petal(storm>0?Math.random()<0.5:true));
    while(petals.length>want){ const i=petals.findIndex(p=>p.y<0); petals.splice(i<0?petals.length-1:i,1); }
    if(storm>0) storm-=1/60;
    for(const p of petals){
      const d=Math.hypot(p.x-px,p.y-py);
      if(d<130){ const f=(1-d/130)*1.5; p.vx+=(p.x-px)/(d+6)*f*0.9; p.vy+=(p.y-py)/(d+6)*f*0.5-0.05; pushes++; }
      const wx=Math.max(-24,Math.min(24,pvx)), wy=Math.min(24,Math.abs(pvy));
      p.vx+=wx*0.007; p.vy+=wy*0.002;
      p.vx*=0.985; p.vy=Math.min(0.75,p.vy+0.004);
      p.x+=p.vx+Math.sin(t*p.sw+p.ph)*0.45; p.y+=p.vy; p.rot+=p.vr+Math.sin(t+p.ph)*0.006;
      if(p.y>H+24||p.y<-H*0.5||p.x<-40||p.x>W+40) Object.assign(p,petal(true));
      g.save(); g.globalAlpha=p.a; g.translate(p.x,p.y); g.rotate(p.rot); g.scale(p.r,p.r);
      g.drawImage(sprite,-10,-10); g.restore();
    }
    pvx*=0.86; pvy*=0.86;
    requestAnimationFrame(frame);
  }
  frame();
  window.__sakura=()=>({ petals:petals.length, storm:storm>0, branch:!!branch, pushes:pushes, at:[Math.round(px),Math.round(py)],
    nearest:(x,y)=>Math.round(Math.min(...petals.map(p=>Math.hypot(p.x-x,p.y-y)))),
    ys:petals.map(p=>Math.round(p.y)), h:H });
  window.__dump=()=>({ px,py,pvx:+pvx.toFixed(2),pvy:+pvy.toFixed(2), p:petals.slice(0,5).map(p=>[Math.round(p.x),Math.round(p.y),+p.vx.toFixed(2),+p.vy.toFixed(2)]) });
  window.__petalStorm=()=>{ storm=7; document.body.classList.add("sakura"); setTimeout(()=>document.body.classList.remove("sakura"),7000); };
})();

/* ---------- boot ---------- */
function ring(){
  setInterval(()=>{
    const on=$("#state");
    const up=Math.floor((Date.now()-state.started)/1000);
    on.innerHTML=state.cmd+"<span class='val'> \u00b7 up "+up+"s</span>";
  },1000);
}
async function boot(){
  drawMeters(); ring();
  const lines=[["console v2.6 \u00b7 local renderer, zero external widgets","c-dim"],
    ["loading kernel modules ................ ok","c-dim"],
    ["mounting /dev/skills .................. ok","c-dim"],
    ["agent tooling ......................... online","c-ok"],
    ["this page takes input. try `help`, or press `snake`.","c-ok"]];
  for(const [t,c] of lines){await type(t,c,9); await sleep(90)}
  ln("");
  const p=new URLSearchParams(location.search);
  if(p.get("auto")){
    for(const c of p.get("auto").split("|")){await run(c); await sleep(450)}
  }
}
inp.addEventListener("keydown",e=>{
  if(e.key==="Enter"){run()}
  else if(e.key==="ArrowUp"&&history_.length){inp.value=history_.pop()}
});
const history_=[];
const origRun=run;
run=async function(t){const v=(t||inp.value).trim(); if(v)history_.push(v); return origRun(t)};
addEventListener("click",e=>{if(G.on&&e.target===cv)return; inp.focus()});
document.body.classList.add("scan");
if(!new URLSearchParams(location.search).get("noboot"))boot(); else {drawMeters();ring()}
loadFigures();
tapeRow();
let greeted=false;
addEventListener("keydown",()=>{
  if(greeted||tapeMuted) return; greeted=true;
  if(tape && !tplaying && tapePlay(true))
    ln("tape 01 \u00b7 your take from the studio is running underneath. type `studio` for the deck.","c-ok");
});
inp.focus();
</script>

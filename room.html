<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>domanov@vps: ~/room</title>
<style>
  :root{
    --bg:#060a12; --panel:#0a1120; --rail:#132b44; --cyan:#2ee6ff; --magenta:#ff3d9a;
    --lime:#9af03f; --amber:#ffb020; --text:#cfe9f5; --dim:#5f849f; --dimmer:#3c5a75;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--mono);
       min-height:100%;display:flex;align-items:center;justify-content:center;
       background-image:radial-gradient(1200px 600px at 50% -10%,#0b1a2e 0%,transparent 70%)}
  #win{width:min(1000px,94vw);background:var(--panel);border:1px solid rgba(46,230,255,.35);
       box-shadow:0 0 60px rgba(46,230,255,.08)}
  #bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0c1728;
       border-bottom:1px solid var(--rail);font-size:12px;color:#8fb6d6}
  .dot{width:10px;height:10px;border-radius:50%}
  #bar .t{margin-left:8px}
  #bar .right{margin-left:auto;color:var(--magenta);letter-spacing:1.4px;font-size:11px}
  #stage{padding:14px 16px 4px}
  #stage svg{width:100%;height:auto;display:block;border:1px solid var(--rail)}
  #say{padding:0 16px;color:var(--dim);min-height:22px;font-size:13px}
  #pult{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 4px}
  #pult button{font:12px var(--mono);color:var(--dim);background:transparent;
       border:1px solid var(--rail);padding:7px 12px;cursor:pointer}
  #pult button:hover{border-color:var(--cyan);color:var(--cyan)}
  #pult button[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
  #foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px 16px;
        border-top:1px solid var(--rail);margin-top:10px;font-size:12px;color:var(--dim)}
  #foot a{color:var(--cyan)} #link{color:var(--dimmer);word-break:break-all}
  .chip{border:1px solid var(--rail);padding:3px 9px;cursor:pointer;font-size:12px;color:var(--dim)}
  .chip:hover{border-color:var(--cyan);color:var(--cyan)}
  #talkwrap{border-top:1px solid var(--rail);padding:12px 16px 4px}
  #talk{display:flex;flex-direction:column;gap:9px;max-height:230px;overflow-y:auto;
        scrollbar-width:thin}
  #talk:empty{display:none}
  .ex{display:flex;flex-direction:column;gap:3px;animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .me{color:#7fb0c8;font-size:13px;white-space:pre-wrap}
  .m{color:var(--text);font-size:13px;white-space:pre-wrap}
  .m .who{color:var(--magenta)}
  .cap{color:var(--lime);font-size:13px}
  #askform{display:flex;gap:8px;padding:10px 0 2px}
  #ask{flex:1;background:rgba(46,230,255,.06);border:1px solid var(--rail);color:var(--text);
       font:14px var(--mono);padding:7px 10px;border-radius:4px;outline:0}
  #ask:focus{border-color:var(--cyan)}
  #askform button{font:12px var(--mono);color:var(--dim);background:transparent;
       border:1px solid var(--rail);padding:7px 12px;cursor:pointer}
  #askform button:hover{border-color:var(--cyan);color:var(--cyan)}
  #talkhint{color:var(--dimmer);font-size:12px;padding:2px 0 0}
  @media(max-width:560px){ #stage{padding:10px 10px 2px} #pult{padding:10px} #foot{padding:10px} }
</style>
</head>
<body>
<div id="win">
  <div id="bar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span class="t">domanov@vps — ~/room</span>
    <span class="right">ПУЛЬТ</span>
  </div>

  <div id="stage"><div style="color:#5f849f;padding:40px 0;text-align:center">комната грузится…</div></div>

  <div id="say">жми кнопки: картинка меняется сразу, а состояние уезжает в адрес страницы</div>

  <div id="pult">
    <button data-sw="lamp"   aria-pressed="true">свет</button>
    <button data-sw="music"  aria-pressed="false">музыка</button>
    <button data-sw="drums"  aria-pressed="false">барабаны</button>
    <button data-sw="guitar" aria-pressed="false">гитара</button>
    <button data-sw="dog"    aria-pressed="false">Моти</button>
    <button data-sw="decor"  aria-pressed="false">стены</button>
    <button data-sw="secret" aria-pressed="false">секрет</button>
  </div>

  <div id="talkwrap">
    <div id="talk" aria-live="polite"></div>
    <form id="askform" autocomplete="off">
      <input id="ask" type="text" placeholder="спроси Мидзу — что умеешь · кто ты · чай"
             aria-label="вопрос к Мидзу">
      <button type="submit">спросить</button>
    </form>
    <div id="talkhint">диалог по клику: набери фразу и нажми Enter. сама она не заговаривает.</div>
  </div>

  <div id="foot">
    <a id="profile" href="https://github.com/Alexander-Domanov">профиль ↗</a>
    <a href="index.html">консоль ↗</a>
    <span id="clock">время суток — по твоим часам</span>
    <span class="chip" id="copy">скопировать ссылку</span>
    <span id="link"></span>
  </div>
</div>

<script>
/* Комната на странице — тот же файл, что стоит в README: страница берёт его у
   профиля (указатель latest.json) и вставляет как обычный SVG. Кнопки не
   перерисовывают комнату сами — они переключают классы на корне <svg>, а все
   правила состояния живут в самом файле (scripts/room.py, блок «пульт»).
   Поэтому состояние на странице и окно в профиле не могут разойтись.

   Реплики Мидзу продублированы здесь коротким списком: файл приходит из профиля
   с репликой своего состояния, а нажатие должно отвечать сразу. Каноничные
   правила — в room.py, функция line_for. */
const SRC = "https://alexander-domanov.github.io/Alexander-Domanov/assets/room/";
/* Тот же ящик, из которого воркер профиля берёт состояние: нажатие уходит сюда,
   и в течение часа окно в README перерисовывается так же. Адрес публичный —
   поэтому в него уезжают только классы состояния, ни строчки текста. */
const REMOTE = "https://ntfy.sh/domanov-room-4f2c9ab71e05";
const SW = ["lamp", "music", "drums", "guitar", "dog", "decor", "secret"];
const ON = {lamp:1, music:0, drums:0, guitar:0, decor:0, secret:0, dog:0};
const SAY = {
  secret: "Нашла. Чай в четыре утра, только между нами.",
  drums:  "Барабаны. Моти сейчас уйдёт спать в коридор.",
  music:  "Играю. Слушай, если не спешишь.",
  dog:    "Моти проснулся. Он тебя видит.",
  lamp0:  "Свет выключила. Экрана хватит.",
  decor:  "Стены другие. Мне так спокойнее."
};

/* Мидзу говорит: не картинка, а собеседник. Отвечает на сказанное, а не крутит
   один текст. Характер — спокойный, любопытный, с сухой иронией; реплики
   зависят от часа гостя. Список умений — caps: его видно в ответ на «что
   умеешь». Диалог только по клику: сама она не заговаривает, ничего не
   всплывает. Канон персонажа — CHARACTER.md, тексты держим рядом с пультом,
   чтобы слово и вид не расходились. */
const MIZU = {
  about: ["Мидзу. Живу в комнате, печатаю быстрее, чем говорю.",
          "Люблю чай и тишину. Ирония без подколов — не обижайся."],
  caps: ["свет — включу или погашу лампу",
         "музыка, барабаны, гитара — играю по нажатию",
         "Моти — бужу собаку",
         "стены — меняю вид комнаты",
         "чай — одно слово, и ты поймёшь",
         "время — скажу, какой у тебя час"],
  greet: {morning:"Доброе утро. Чайник греется.",
          day:"День. Я за консолью, но слушаю.",
          evening:"Вечер. Лампа тёплая, говори.",
          night:"Ночь. Говори тише, я почти сплю."},
  idle: {morning:["Утро пахнет чаем. Спрашивай.", "Окно открыла. Садись, расскажу."],
         day:["Работаю. Спрашивай, отвечу по делу.", "День ровный, бумаги ждут. Твой ход."],
         evening:["Читаю, но отложу абзац ради тебя.", "Лампа тёплая. Слушаю."],
         night:["Дремлю в кресле. Экран ещё светит.", "Тише, ночь. Говори вполголоса."]}
};
let turn = 0;

/* Возвращает список частей ответа: {say} — строка, {say, caps} — строка и
   список умений. */
function mizuAnswer(text, moment){
  const t = String(text || "").toLowerCase();
  const has = (...ws) => ws.some(w => t.includes(w));
  if(has("привет","здравств","добрый","hi","hello","хай","салют"))
    return [{say: MIZU.greet[moment]}];
  if(has("что умеешь","умеешь","что можешь","помощь","help","команд","умения"))
    return [{say: "Умею немного:", caps: true}];
  if(has("кто ты","как тебя","тебя зовут","твоё имя","твое имя","о себе","мидзу","who are you"))
    return MIZU.about.map(s => ({say: s}));
  if(has("музык","играй","играть","мелоди","звук","песн"))
    return [{say: "Играю. Слушай, если не спешишь."}];
  if(has("барабан"))
    return [{say: "Барабаны. Моти сейчас уйдёт спать в коридор."}];
  if(has("гитар"))
    return [{say: "Гитара на стене. Трону струну — комната дрогнет."}];
  if(has("моти","собак","пёс","пес","щен"))
    return [{say: "Моти спит у тёплого места. Разбудить?"}];
  if(has("чай","секрет","тайна"))
    return [{say: "Чай в четыре утра. Только между нами."}];
  if(has("спать","спокойной ночи","устал","отдых"))
    return [{say: moment === "night" ? "Ложись. Я погашу лампу, экран досветит."
                                      : "Ложись, если надо. Я тут посижу."}];
  if(has("время","который час","час","time"))
    return [{say: "У тебя сейчас " + MOMENT_RU[moment] + "."}];
  const pool = MIZU.idle[moment];
  return [{say: pool[turn++ % pool.length]}];
}

function sayNode(parts){
  const box = document.createElement("div");
  box.className = "m";
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = "Мидзу › ";
  box.appendChild(who);
  parts.forEach(part => {
    const line = document.createElement("div");
    line.textContent = part.say;
    box.appendChild(line);
    if(part.caps){
      MIZU.caps.forEach(c => {
        const cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = "— " + c;
        box.appendChild(cap);
      });
    }
  });
  return box;
}

const stage = document.getElementById("stage");
const say = document.getElementById("say");
const link = document.getElementById("link");
let svg = null;
let base = [];
let rest = "как оставил последний гость:";

/* Время суток берём у гостя, а не у сервера: у человека вечер — значит вечер.
   Границы те же, что в scripts/room.py (HOURS): до 5 ночь, с 5 утро, с 11 день,
   с 18 вечер, с 22 ночь. Вид берём из карты «время суток → файл» в указателе
   профиля: там лежат все четыре вида, нарисованные для одного состояния. */
const HOURS = [[5, "morning"], [11, "day"], [18, "evening"], [22, "night"]];
const MOMENT_RU = {morning: "утро", day: "день", evening: "вечер", night: "ночь"};

function guestMoment(){
  const hour = new Date().getHours();
  let name = "night";
  for(const [start, value] of HOURS){ if(hour >= start) name = value; }
  return name;
}

const params = new URLSearchParams(location.search);

function readUrl(){
  const r = params.get("r");
  if(!r) return;
  r.split(/[\s,]+/).forEach(tok=>{
    const m = /^m-([a-z]+)([01])$/.exec(tok.trim());
    if(m && SW.includes(m[1])) ON[m[1]] = Number(m[2]);
  });
}

function stateClasses(){ return SW.map(k => "m-" + k + (ON[k] ? 1 : 0)).join(" "); }

function say_(){
  if(ON.secret) return SAY.secret;
  if(ON.drums) return SAY.drums;
  if(ON.music) return SAY.music;
  if(ON.dog) return SAY.dog;
  if(!ON.lamp) return SAY.lamp0;
  if(ON.decor) return SAY.decor;
  return "";
}

function paint(){
  if(!svg) return;
  svg.setAttribute("class", base.concat(stateClasses()).join(" "));
  const line = say_();
  const t = svg.querySelector("#line");
  if(t && line) t.textContent = line;
  say.textContent = line || (rest + " · жми кнопки");
  [...document.querySelectorAll("#pult button")].forEach(b=>{
    b.setAttribute("aria-pressed", ON[b.dataset.sw] ? "true" : "false");
  });
  const q = new URLSearchParams(location.search);
  q.set("r", stateClasses());
  const url = location.pathname + "?" + q.toString();
  history.replaceState(null, "", url);
  link.textContent = location.origin + url;
}

document.getElementById("pult").addEventListener("click", e=>{
  const sw = e.target.dataset && e.target.dataset.sw;
  if(!sw) return;
  ON[sw] = ON[sw] ? 0 : 1;
  paint();
  publish();
});

/* Отправляем только классы: m-lamp1 m-music0 … Ничего, что набрал гость,
   сюда не попадает — набирать тут нечего. */
function publish(){
  try{
    fetch(REMOTE, {method:"POST", mode:"no-cors", body: stateClasses()});
    const chip = document.getElementById("copy");
    chip.textContent = "нажатие ушло: окно в профиле подтянет его в течение часа";
  }catch(e){}
}

document.getElementById("copy").addEventListener("click", async ()=>{
  try{ await navigator.clipboard.writeText(location.href);
       document.getElementById("copy").textContent = "ссылка скопирована"; }
  catch{ location.hash = ""; }
});

/* Диалог: гость набрал фразу — Мидзу ответила. Сама она не заговаривает:
   пока не нажмёшь Enter, в журнале пусто. */
document.getElementById("askform").addEventListener("submit", e=>{
  e.preventDefault();
  const inp = document.getElementById("ask");
  const q = (inp.value || "").trim();
  if(!q) return;
  const talk = document.getElementById("talk");
  const ex = document.createElement("div");
  ex.className = "ex";
  const me = document.createElement("div");
  me.className = "me";
  me.textContent = "ты › " + q;
  ex.appendChild(me);
  ex.appendChild(sayNode(mizuAnswer(q, guestMoment())));
  talk.appendChild(ex);
  talk.scrollTop = talk.scrollHeight;
  inp.value = "";
});

async function boot(){
  readUrl();
  const mine = guestMoment();
  try{
    const latest = await (await fetch(SRC + "latest.json", {cache:"no-store"})).json();
    // Вид по времени суток гостя. Если в указателе такого вида ещё нет (старый
    // файл профиля), показываем вид профиля — комната всё равно откроется.
    const file = (latest.moments || {})[mine] || latest.name;
    const text = await (await fetch(SRC + file, {cache:"no-store"})).text();
    stage.innerHTML = text;
    svg = stage.querySelector("svg");
    base = [...svg.classList].filter(c => c.startsWith("moment-"));
    // Открываем комнату такой, какая она в профиле: состояние берём из самого
    // файла, а не из выдуманного «по умолчанию». Ссылка ?r= перебивает файл.
    svg.classList.forEach(c => {
      const m = /^m-([a-z]+)([01])$/.exec(c);
      if(m && SW.includes(m[1])) ON[m[1]] = Number(m[2]);
    });
    readUrl();
    const who = latest.stateFrom === "guest" ? "как оставил последний гость" : "как я её оставил";
    rest = "состояние: " + who + ":";
    const clock = document.getElementById("clock");
    clock.textContent = (file === latest.name)
      ? "время суток — по твоим часам: " + MOMENT_RU[mine]
      : "время суток — по твоим часам: " + MOMENT_RU[mine] + " (профиль сейчас показывает другой вид)";
    paint();
  }catch(err){
    stage.innerHTML = '<div style="color:#ff3d9a;padding:24px 0">комната не приехала: ' +
      (err && err.message ? err.message : err) + "</div>";
  }
}
boot();
</script>
</body>
</html>
